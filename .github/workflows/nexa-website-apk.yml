name: Build NEXA MUSIC website APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unpack Android wrapper project
        run: |
          mkdir -p /tmp/nexa-apk-src
          python3 -m zipfile -e NEXA-MUSIC-Website-APK-source.zip /tmp/nexa-apk-src
      - name: Build APK
        run: gradle --no-daemon -p /tmp/nexa-apk-src :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-MUSIC-Website-APK
          path: /tmp/nexa-apk-src/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Pages source
        run: |
          install -D /tmp/nexa-apk-src/app/build/outputs/apk/debug/app-debug.apk NEXA-MUSIC-Website.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NEXA-MUSIC-Website.apk
          git commit -m 'Publish NEXA MUSIC website APK'
          git push
