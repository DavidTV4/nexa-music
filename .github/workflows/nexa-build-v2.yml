name: Build NEXA MUSIC APK corrected

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract project
        run: python3 -m zipfile -e NEXA-MUSIC-Website-APK-source.zip /tmp/nexa-apk-src
      - name: Build APK
        run: gradle --no-daemon -p /tmp/nexa-apk-src :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NEXA-MUSIC-Website-APK
          path: /tmp/nexa-apk-src/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK
        run: |
          cp /tmp/nexa-apk-src/app/build/outputs/apk/debug/app-debug.apk NEXA-MUSIC-Website.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NEXA-MUSIC-Website.apk
          git commit -m 'Publish website APK'
          git push
